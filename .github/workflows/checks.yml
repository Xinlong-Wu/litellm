name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Repository ref to check. Empty checks the ref that triggered the caller (PR merge preview)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  compile-and-import:
    name: Compile and Import Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile every module
        run: uv run --no-sync python -m compileall -q litellm

      - name: Import safety
        run: uv run --no-sync python -c "from litellm import *; print('[from litellm import *] OK')"

  lint-ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: cd litellm && uv run --no-sync ruff check .

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-utils
            paths: tests/test_litellm/litellm_core_utils
            workers: 2
            reruns: 1
          - name: integrations
            paths: tests/test_litellm/integrations
            workers: 2
            reruns: 3
          - name: providers-vertex
            paths: tests/test_litellm/llms/vertex_ai
            workers: 1
            reruns: 2
          - name: providers-other
            paths: tests/test_litellm/llms --ignore=tests/test_litellm/llms/vertex_ai
            workers: 2
            reruns: 2
          - name: proxy-auth
            paths: tests/test_litellm/proxy/auth tests/test_litellm/proxy/hooks tests/test_litellm/proxy/policy_engine tests/test_litellm/proxy/client
            workers: 2
            reruns: 2
          - name: proxy-endpoints
            paths: tests/test_litellm/proxy/management_endpoints tests/test_litellm/proxy/guardrails tests/test_litellm/proxy/management_helpers tests/test_litellm/proxy/anthropic_endpoints tests/test_litellm/proxy/google_endpoints tests/test_litellm/proxy/openai_files_endpoint tests/test_litellm/proxy/response_api_endpoints tests/test_litellm/proxy/image_endpoints tests/test_litellm/proxy/vector_store_endpoints tests/test_litellm/proxy/agent_endpoints tests/test_litellm/proxy/a2a tests/test_litellm/proxy/discovery_endpoints tests/test_litellm/proxy/health_endpoints tests/test_litellm/proxy/shutdown tests/test_litellm/proxy/public_endpoints tests/test_litellm/proxy/prompts tests/test_litellm/proxy/rag_endpoints tests/test_litellm/proxy/realtime_endpoints tests/test_litellm/proxy/ui_crud_endpoints tests/test_litellm/proxy/utils
            workers: 2
            reruns: 2
          - name: proxy-server
            paths: tests/test_litellm/proxy/proxy_server
            workers: 4
            reruns: 2
          - name: proxy-infra
            paths: tests/test_litellm/proxy/db tests/test_litellm/proxy/middleware tests/test_litellm/proxy/spend_tracking tests/test_litellm/proxy/pass_through_endpoints tests/test_litellm/proxy/_experimental tests/test_litellm/proxy/experimental tests/test_litellm/proxy/common_utils tests/test_litellm/proxy/test_*.py
            workers: 2
            reruns: 2
          - name: responses-caching-types
            paths: tests/test_litellm/responses tests/test_litellm/caching tests/test_litellm/types
            workers: 2
            reruns: 2
          - name: enterprise-routing
            paths: tests/test_litellm/enterprise tests/test_litellm/google_genai tests/test_litellm/router_utils tests/test_litellm/router_strategy
            workers: 2
            reruns: 2
          - name: misc
            paths: tests/test_litellm/secret_managers tests/test_litellm/a2a_protocol tests/test_litellm/anthropic_interface tests/test_litellm/completion_extras tests/test_litellm/containers tests/test_litellm/experimental_mcp_client tests/test_litellm/models tests/test_litellm/repositories tests/test_litellm/images tests/test_litellm/interactions tests/test_litellm/passthrough tests/test_litellm/vector_stores tests/test_litellm/test_*.py
            workers: 2
            reruns: 2
            # test_github_triage_workflows asserts on upstream's .github/workflows
            # triage YAMLs, which this fork intentionally does not carry (the sync
            # keeps only the fork's curated workflow set). Deselect it here.
            extra: -k "not github_triage_workflows"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install test dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Build Admin UI
        if: matrix.name == 'proxy-server' || matrix.name == 'proxy-infra'
        run: bash docker/build_admin_ui.sh

      - name: Run unit tests
        run: |
          uv run --no-sync pytest ${{ matrix.paths }} ${{ matrix.extra }} \
            --tb=short -vv \
            -n ${{ matrix.workers }} \
            --reruns ${{ matrix.reruns }} --reruns-delay 1 \
            --durations=20
