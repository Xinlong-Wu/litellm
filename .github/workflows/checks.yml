name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Repository ref to check. Empty checks the ref that triggered the caller (PR merge preview)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  compile-and-import:
    name: Compile and Import Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile every module
        run: uv run --no-sync python -m compileall -q litellm

      - name: Import safety
        run: uv run --no-sync python -c "from litellm import *; print('[from litellm import *] OK')"

  lint-ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: cd litellm && uv run --no-sync ruff check .

  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-utils
            paths: tests/unit/litellm_core_utils
            workers: 2
            reruns: 1
          - name: integrations
            paths: tests/unit/integrations
            workers: 2
            reruns: 3
          - name: providers-vertex
            paths: tests/unit/llms/vertex_ai
            workers: 1
            reruns: 2
          - name: providers-other
            paths: tests/unit/llms --ignore=tests/unit/llms/vertex_ai
            workers: 2
            reruns: 2
          - name: proxy-auth
            paths: tests/unit/proxy/auth tests/unit/proxy/hooks tests/unit/proxy/policy_engine tests/unit/proxy/client
            workers: 2
            reruns: 2
          - name: proxy-endpoints
            paths: tests/unit/proxy/management_endpoints tests/unit/proxy/guardrails tests/unit/proxy/management_helpers tests/unit/proxy/anthropic_endpoints tests/unit/proxy/google_endpoints tests/unit/proxy/openai_files_endpoint tests/unit/proxy/response_api_endpoints tests/unit/proxy/image_endpoints tests/unit/proxy/vector_store_endpoints tests/unit/proxy/agent_endpoints tests/unit/proxy/a2a tests/unit/proxy/discovery_endpoints tests/unit/proxy/health_endpoints tests/unit/proxy/shutdown tests/unit/proxy/public_endpoints tests/unit/proxy/prompts tests/unit/proxy/rag_endpoints tests/unit/proxy/realtime_endpoints tests/unit/proxy/ui_crud_endpoints tests/unit/proxy/utils
            workers: 2
            reruns: 2
          - name: proxy-server
            paths: tests/unit/proxy/proxy_server
            workers: 4
            reruns: 2
          - name: proxy-infra
            paths: tests/unit/proxy/db tests/unit/proxy/middleware tests/unit/proxy/spend_tracking tests/unit/proxy/pass_through_endpoints tests/unit/proxy/_experimental tests/unit/proxy/experimental tests/unit/proxy/common_utils tests/unit/proxy/test_*.py
            workers: 2
            reruns: 2
          - name: responses-caching-types
            paths: tests/unit/responses tests/unit/caching tests/unit/types
            workers: 2
            reruns: 2
          - name: enterprise-routing
            paths: tests/unit/enterprise tests/unit/google_genai tests/unit/router_utils tests/unit/router_strategy
            workers: 2
            reruns: 2
          - name: misc
            paths: tests/unit/secret_managers tests/unit/a2a_protocol tests/unit/anthropic_interface tests/unit/completion_extras tests/unit/containers tests/unit/experimental_mcp_client tests/unit/models tests/unit/repositories tests/unit/images tests/unit/interactions tests/unit/passthrough tests/unit/vector_stores
            workers: 2
            reruns: 2
            # These tests assert on upstream's full workflow and shard layout,
            # which this fork intentionally replaces with this curated workflow.
            extra: >-
              -k "not github_triage_workflows and not select_ui_test_scope
              and not assert_ci_coverage and not assert_workflow_dir_hygiene"
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"
          enable-cache: true

      - name: Install test dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Build Admin UI
        if: matrix.name == 'proxy-server' || matrix.name == 'proxy-infra'
        run: bash docker/build_admin_ui.sh

      - name: Run unit tests
        run: |
          uv run --no-sync pytest ${{ matrix.paths }} ${{ matrix.extra }} \
            --tb=short -vv \
            -n ${{ matrix.workers }} \
            --reruns ${{ matrix.reruns }} --reruns-delay 1 \
            --durations=20
