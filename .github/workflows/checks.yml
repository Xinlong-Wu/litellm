name: Checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Repository ref to check. Empty checks the ref that triggered the caller (PR merge preview)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  compile-and-import:
    name: Compile and Import Safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile every module
        run: uv run --no-sync python -m compileall -q litellm

      - name: Import safety
        run: uv run --no-sync python -c "from litellm import *; print('[from litellm import *] OK')"

  lint-ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: cd litellm && uv run --no-sync ruff check .

  unit-tests:
    name: Unit Tests (tests/test_litellm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.9"

      - name: Install test dependencies
        run: |
          uv sync --frozen --all-groups --all-extras
          uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

      - name: Run unit tests
        run: uv run --no-sync pytest tests/test_litellm -x -vv -n 4
