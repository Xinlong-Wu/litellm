name: Sync Upstream Release to GHCR

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream LiteLLM release tag to build. Leave empty to use the latest release."
        required: false
        type: string
      force_rebuild:
        description: "Rebuild and push even if the GHCR tag already exists."
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: sync-upstream-release-to-ghcr
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: BerriAI/litellm
  IMAGE_NAME: litellm-all-in-one
  DOWNSTREAM_BRANCH: litellm_internal_staging

jobs:
  build-and-push:
    name: Sync, Build, and Push Upstream Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Resolve upstream release
        id: release
        env:
          UPSTREAM_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_tag || '' }}
        run: |
          if [ -n "${UPSTREAM_TAG_INPUT}" ]; then
            tag="${UPSTREAM_TAG_INPUT}"
          else
            tag="$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/releases/latest" | jq -r '.tag_name')"
          fi

          if [ -z "${tag}" ] || [ "${tag}" = "null" ]; then
            echo "::error::Unable to resolve upstream release tag"
            exit 1
          fi

          if ! echo "${tag}" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::Release tag '${tag}' is not a valid Docker tag"
            exit 1
          fi

          curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/releases/tags/${tag}" >/dev/null

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout downstream repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream release into downstream branch
        id: sync
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          git checkout "${DOWNSTREAM_BRANCH}"
          git pull --ff-only origin "${DOWNSTREAM_BRANCH}"

          upstream_commit="$(git rev-list -n 1 "refs/tags/${TAG}")"

          if git merge-base --is-ancestor "${upstream_commit}" HEAD; then
            echo "Downstream ${DOWNSTREAM_BRANCH} already contains upstream release ${TAG}."
          else
            if ! git merge --no-edit "refs/tags/${TAG}"; then
              conflict_files="$(git diff --name-only --diff-filter=U | sed 's/^/- /')"
              git merge --abort

              sync_branch="upstream-release/${TAG}"
              git checkout -B "${sync_branch}" "${upstream_commit}"
              git push origin "HEAD:refs/heads/${sync_branch}" --force

              {
                echo "conflict=true"
                echo "conflict_branch=${sync_branch}"
                echo "conflict_files<<EOF"
                echo "${conflict_files}"
                echo "EOF"
              } >> "${GITHUB_OUTPUT}"

              exit 0
            fi
            git push origin "HEAD:refs/heads/${DOWNSTREAM_BRANCH}"
          fi

          echo "conflict=false" >> "${GITHUB_OUTPUT}"
          echo "branch=${DOWNSTREAM_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "commit=${upstream_commit}" >> "${GITHUB_OUTPUT}"

      - name: Open sync pull request
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          CONFLICT_BRANCH: ${{ steps.sync.outputs.conflict_branch }}
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
        run: |
          existing_pr="$(gh pr list --head "${CONFLICT_BRANCH}" --base "${DOWNSTREAM_BRANCH}" --json number --jq '.[0].number')"
          if [ -n "${existing_pr}" ]; then
            echo "Sync pull request already exists for ${CONFLICT_BRANCH}."
            exit 0
          fi

          gh pr create \
            --base "${DOWNSTREAM_BRANCH}" \
            --head "${CONFLICT_BRANCH}" \
            --title "Sync upstream LiteLLM ${TAG}" \
            --body "Automatic merge of upstream release ${TAG} into ${DOWNSTREAM_BRANCH} had conflicts.

          Conflicted files:
          ${CONFLICT_FILES}

          Resolve this PR manually, then rerun the workflow to build and push the Docker image."

      - name: Checkout synced downstream branch
        if: steps.sync.outputs.conflict != 'true'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ steps.sync.outputs.branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare image metadata
        if: steps.sync.outputs.conflict != 'true'
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/${IMAGE_NAME}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: steps.sync.outputs.conflict != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing image
        if: steps.sync.outputs.conflict != 'true'
        id: existing
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "${FORCE_REBUILD}" != "true" ] && docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image ${IMAGE}:${TAG} already exists; skipping build."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free up disk space
        if: steps.sync.outputs.conflict != 'true' && steps.existing.outputs.exists != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        if: steps.sync.outputs.conflict != 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        if: steps.sync.outputs.conflict != 'true' && steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.release.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sync.outputs.commit }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
